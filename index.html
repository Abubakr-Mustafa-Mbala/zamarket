<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1013" />
    <!-- Critical background prevents the browser's white paint between page and JS/CSS loads. -->
    <style>html,body,#root{margin:0;min-height:100%;background:#0E1013;color:#EDEFF2;color-scheme:dark}html{background-color:#0E1013}#root{min-height:100vh}</style>
    <title>ZA Market — Shop Online in Lusaka, Zambia</title>
    <meta name="description" content="Shop products and services from local sellers in Lusaka, Zambia. Discover phones, fashion, home essentials, food and more on ZA Market." />
    <link rel="canonical" href="https://zamarket.shop/" />
    <!-- One icon set. The .ico carries 16, 32 and 48, which is what Google
         shows beside the search result; at those sizes it is the monogram
         on its own, because the full mark's sweep turns to mush below 48px. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="application-name" content="ZaMarket" />
    <meta name="apple-mobile-web-app-title" content="ZaMarket" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
